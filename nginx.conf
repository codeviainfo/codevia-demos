# Fallback si alguien entra por el hostname interno de Docker.
# Es también el destino del healthcheck del compose.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html/restaurante;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}
