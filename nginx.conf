# Un único contenedor nginx sirviendo las 4 plantillas demo,
# enrutadas por subdominio (Host header) hacia carpetas estáticas
# independientes. nginx-proxy reenvía el Host original, así que
# cada server_name recibe solo su tráfico.
#
# IMPORTANTE: estos nombres son literales (nginx no soporta comodín
# de dos niveles tipo "demo-restaurante.*.com"). Si cambias los
# dominios en deploy/.env, actualiza también los server_name de aquí.
#
# Las demos ahora son SPAs de React compiladas con Vite. El `root`
# de cada una no cambia respecto a la versión estática anterior:
# el Dockerfile deposita el `dist` en la misma ruta de siempre.

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# Vite pone un hash en el nombre de cada asset, así que su contenido
# nunca cambia bajo el mismo nombre: se pueden cachear para siempre.
# El HTML, en cambio, sigue revalidándose para que un redeploy se
# vea al instante.
map $uri $demo_cache {
    default                 "no-cache, must-revalidate";
    ~^/assets/              "public, max-age=31536000, immutable";
    ~*\.(jpg|jpeg|png|webp|avif|svg|woff2)$ "public, max-age=2592000";
}

server {
    listen 80;
    server_name demo-restaurante.codeviaesp.com;
    root /usr/share/nginx/html/restaurante;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control $demo_cache always;
    location / { try_files $uri $uri/ /index.html; }
}

