# Un único contenedor nginx sirviendo las 3 plantillas demo,
# enrutadas por subdominio (Host header) hacia carpetas estáticas
# independientes. nginx-proxy reenvía el Host original, así que
# cada server_name recibe solo su tráfico.
#
# IMPORTANTE: estos nombres son literales (nginx no soporta comodín
# de dos niveles tipo "demo-restaurante.*.com"). Si cambias los
# dominios en deploy/.env, actualiza también los server_name de aquí.

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 80;
    server_name demo-restaurante.codeviaesp.com;
    root /usr/share/nginx/html/restaurante;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name demo-clinica.codeviaesp.com;
    root /usr/share/nginx/html/clinica;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name demo-tienda.codeviaesp.com;
    root /usr/share/nginx/html/tienda;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
    location / { try_files $uri $uri/ /index.html; }
}

# Fallback si alguien entra por el hostname interno de Docker
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html/restaurante;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}
